<div class="check-page">
  <a class="logo" routerLink="/login" aria-label="Nevora Home">
  <img
    src="/images/logo without background.png"
    alt="Nevora Logo"
  />
</a>
  <main class="check-card">
    <div class="mail-icon" aria-hidden="true">✉</div>

    <h1>Check Your Email</h1>

    <p class="description">
      We sent a verification code to your email address.
      Please enter the 4-digit code below to continue.
    </p>

    <form (ngSubmit)="onSubmit()" #codeForm="ngForm">
      <label for="code-0">Verification Code</label>

      <div class="code-inputs">
        <input
          *ngFor="let digit of digits; let i = index"
          [id]="'code-' + i"
          [name]="'digit-' + i"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="1"
          pattern="[0-9]"
          required
          [(ngModel)]="digits[i]"
          (input)="onDigitInput($event, i)"
          (keydown)="onDigitKeydown($event, i)"
          (paste)="onPaste($event)"
          [attr.aria-label]="'Digit ' + (i + 1)"
        />
      </div>

      <p class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <p class="success" *ngIf="successMessage">
        {{ successMessage }}
      </p>

      <button class="next-btn" type="submit" [disabled]="!isCodeComplete">
        Next
      </button>
    </form>

    <p class="resend-text">
      Didn't receive the code?
      <button type="button" class="resend-link" (click)="resendCode()">
        Click to resend
      </button>
    </p>

    <a class="back-link" routerLink="/login">
      <span aria-hidden="true">←</span>
      Back to Login
    </a>
  </main>
</div>
