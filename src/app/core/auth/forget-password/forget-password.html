
<div class="forgot-page">
  <a class="logo" routerLink="/login" aria-label="Nevora Home">
    <img src="/images/logo without background.png" alt="Nevora Logo" />
  </a>

  <main class="forgot-card">
    <svg
      class="key-icon"
      viewBox="0 0 24 24"
      width="32"
      height="32"
      fill="none"
      stroke="#f0b93a"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="15.5" cy="8.5" r="4.5" />
      <path d="M12.3 11.7 4 20" />
      <path d="M7 17l2.5 2.5" />
      <path d="M9.5 14.5l2 2" />
    </svg>

    <h1>Forgot password?</h1>

    <p class="description">
      Enter your email address and we’ll send you a link to reset your password
    </p>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="Enter your email"
        [class.invalid]="errorMessage"
        (input)="clearMessages()"
      />

      <p class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <p class="success" *ngIf="successMessage">
        {{ successMessage }}
      </p>

      <div class="actions">
        <button class="cancel-btn" type="button" routerLink="/login">Cancel</button>

        <button class="reset-btn" type="submit">Reset Password</button>
      </div>
    </form>

    <a class="back-link" routerLink="/login">
      <span aria-hidden="true">←</span>
      Back to Login
    </a>
  </main>
</div>
