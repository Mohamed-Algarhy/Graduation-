
<div class="page">
  <img
    src="/images/WhatsApp%20Image%202026-10-05%20at%2012.16.04%20AM.jpeg"
    alt="Nevora Logo"
    class="logo"
  />

  <div class="card">
    <svg
      class="key"
      width="40"
      height="40"
      viewBox="0 0 24 24"
      fill="none"
      stroke="#F2C14E"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="16" cy="8" r="5" />
      <path d="M12.5 11.5L4 20" />
      <path d="M7 17l2 2" />
      <path d="M10 14l2 2" />
    </svg>

    <h1>Forgot password?</h1>

    <p class="sub">
      Enter your email address and we'll send you a link to reset your password
    </p>

    <div class="field">
      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        [formControl]="email"
      />

      @if (email.touched && email.invalid) {
        <p class="error">
          @if (email.hasError('required')) {
            Email is required.
          } @else if (email.hasError('email')) {
            Please enter a valid email address.
          }
        </p>
      }
    </div>

    <div class="actions">
      <a routerLink="/login" class="cancel">Cancel</a>

      <button
        class="btn"
        type="button"
        (click)="submit()"
      >
        Reset Password
      </button>
    </div>

    <a routerLink="/login" class="back">← Back to Login</a>
  </div>
</div>
