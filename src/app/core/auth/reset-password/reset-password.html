<!-- logo -->
<div class="logo">
  <img src="/public/images/logo without background.png" class="logo-nevora">
</div>

<main class="reset-pass">

  <div class="reset-pass-header">
    <svg class="lock" viewBox="0 0 48 52" aria-hidden="true">
      <path d="M13 24 V16 a11 11 0 0 1 22 0 V24" fill="none" stroke="#9a9a8a" stroke-width="4"/>
      <rect x="5" y="22" width="38" height="28" rx="3" fill="#c9b864"/>
      <rect x="5" y="22" width="38" height="6" rx="3" fill="#dccd7e"/>
      <rect x="5" y="44" width="38" height="6" rx="3" fill="#a8984a"/>
    </svg>
    <h1>Reset Your Password</h1>
    <p>Create a strong new password for account.</p>
  </div>

  <form id="resetForm" novalidate [formGroup]="resetForm" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="password">New Password</label>
      <div class="input-wrap">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          formControlName="password"
          [class.invalid]="passwordInvalid"
          (input)="onPasswordInput()"
          placeholder="••••••••••"
          autocomplete="new-password"
          required>
        <button type="button" class="toggle" (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <i class="fa-solid" [class.fa-eye]="showPassword" [class.fa-eye-slash]="!showPassword"></i>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="confirm">Confirm New Password</label>
      <div class="input-wrap">
        <input
          [type]="showConfirm ? 'text' : 'password'"
          id="confirm"
          formControlName="confirm"
          [class.invalid]="confirmInvalid"
          (input)="onConfirmInput()"
          placeholder="••••••••••"
          autocomplete="new-password"
          required>
        <button type="button" class="toggle" (click)="showConfirm = !showConfirm"
                [attr.aria-label]="showConfirm ? 'Hide password' : 'Show password'">
          <i class="fa-solid" [class.fa-eye]="showConfirm" [class.fa-eye-slash]="!showConfirm"></i>
        </button>
      </div>
    </div>

    <ul class="rules" aria-live="polite">
      <li id="rule-length" [class.met]="ruleLengthMet">Must be at least 8 characters</li>
      <li id="rule-chars" [class.met]="ruleCharsMet">Contains numbers &amp; symbols</li>
    </ul>

    <p class="message" id="message" role="alert">{{ message }}</p>

    <button type="submit" class="submit">Reset Password</button>
  </form>
</main>
